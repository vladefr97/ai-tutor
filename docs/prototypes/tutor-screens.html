const tracks={python:{name:'Python Developer',short:'Python',desc:'От первых функций до своих приложений. Код, практика и ревью.',goal:'Хочу научиться писать небольшие API на Python',title:'Ваш первый API на Python',result:'Создадите API списка дел: от первого обработчика до проверки ошибок и самостоятельного проекта.',topics:[['Функции и работа с данными','Аргументы и возвращаемые значения','Списки и словари','Проверка входных данных','Написать функцию, которая проверяет и сохраняет задачу.'],['Первый HTTP-обработчик','Запрос и ответ','Маршруты и методы HTTP','JSON и коды ответа','Реализовать создание и получение задач через API.'],['Проверки и обработка ошибок','Обязательные поля','Ошибки клиента','Автоматические тесты','Обработать пустое название и запрос к несуществующей задаче.'],['Самостоятельный проект','Требования к API','Сдача через pull request','Итоговая проверка','Создать новый небольшой API без подсказок наставника.']]},git:{name:'Наставник по Git',short:'Git',desc:'Коммиты, ветки и pull request. Освойте привычный рабочий процесс.',goal:'Хочу разобраться с ветками и pull request',title:'Git для самостоятельной работы',result:'Пройдёте путь изменения: от новой ветки до проверенного и объединённого pull request.',topics:[['Репозиторий и первый коммит','Рабочая директория','Индекс и коммит','История изменений','Создать репозиторий и сохранить осмысленное изменение.'],['Работа с ветками','Создание ветки','Переключение контекста','Сравнение изменений','Выполнить две независимые задачи в разных ветках.'],['Pull request и ревью','Отправка изменений','Описание pull request','Ответ на замечания','Открыть PR и внести исправления после ревью.'],['Самостоятельная задача','Работа с историей','Разрешение конфликта','Проверка результата','Провести изменение через полный рабочий процесс.']]},pm:{name:'Project Manager',short:'Project Management',desc:'Цели, задачи и команда. Учитесь управлять проектом на практике.',goal:'Хочу освоить основы управления проектами',title:'Основы управления проектами',result:'Спланируете небольшой проект: определите результат, задачи, сроки и риски, а затем учтёте изменение условий.',topics:[['Цель и границы проекта','Результат проекта','Заинтересованные стороны','Критерии успеха','Описать цель и границы учебного вебинара.'],['Задачи, зависимости и сроки','Декомпозиция','Порядок работ','Ответственность и сроки','Составить реалистичный план подготовки вебинара.'],['Риски и изменения','Оценка рисков','План реагирования','Изменение приоритетов','Изменить план при сокращении времени подготовки.'],['Итоговый кейс и тест','Проверка основ','Самостоятельный план','Новые условия проекта','Отдельно сдать тест и практический кейс.']]}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let screen=new URLSearchParams(location.search).get('screen')||'mentors',track='python',goal='',stage=0,messages=[],revision='',ready=false,generation=0,timer,tab=new URLSearchParams(location.search).get('tab')||'theory',lesson=0,check='running',chatOpen=true,courseMessages=[],readonly=false,student='Илья',pmAnswer='',pmState='';
const data=()=>tracks[track];
function go(s){clearTimeout(timer);screen=s;readonly=false;render();window.scrollTo(0,0)}
function choose(t){track=t;goal='';stage=0;messages=[];revision='';ready=false;lesson=0;tab='theory';check='running';chatOpen=true;courseMessages=[];pmAnswer='';pmState='';readingPage=0;readingStates={};go('chat')}
function context(){return `<button class="at-back" onclick="go('mentors')">← Все наставники</button><div class="at-context"><span class="at-icon">${icons[track]}</span><div><h1>${data().name}</h1><small>Ваш наставник · ${screen==='course'?'обучение':'подготовка курса'}</small></div></div>`}
function msg(text,user=false){return `<div class="at-message ${user?'at-user':''}">${user?'':`<div class="at-message-label">${data().short} · наставник</div>`}<p>${esc(text)}</p></div>`}
function composer(placeholder,handler,id='at-input'){return `<form class="at-composer" onsubmit="${handler}(event)"><textarea id="${id}" aria-label="${placeholder}" placeholder="${placeholder}" required rows="2"></textarea><div class="at-composer-bottom"><span>Можно отвечать своими словами</span><button class="at-send" aria-label="Отправить сообщение">↑</button></div></form>`}
function home(){return `<div class="at-eyebrow">Ваша цель. Ваш темп.</div><h1>Чему хотите научиться?</h1><p class="at-subtitle">Выберите наставника. Вместе вы составите план<br> и перейдёте к практике.</p><div class="at-mentors">${Object.entries(tracks).map(([key,t])=>`<button class="at-mentor" onclick="choose('${key}')"><span class="at-icon">${icons[key]}</span><h2>${t.name}</h2><p>${t.desc}</p><span class="at-mentor-foot">Начать разговор <span aria-hidden="true">↗</span></span></button>`).join('')}</div><p class="at-footnote">Начнём с того, что нужно именно вам.</p>`}
function chat(){return `${context()}${msg('Привет! Я помогу освоить '+data().short+' через практику. Что хотите научиться делать? Можно описать конкретную задачу.')}${messages.map(m=>msg(m.text,m.user)).join('')}${stage===0?`<div class="at-chips"><button class="at-chip" onclick="acceptChat(data().goal)">${esc(data().goal)} ↗</button></div>`:''}${stage<2?composer(stage===0?'Расскажите о вашей цели…':'Что вы уже пробовали?','sendChat'):''}${stage===1?`<button class="at-quiet" onclick="acceptChat('Начинаю с нуля, без входного интервью.')" style="margin-top:13px">Пропустить интервью и начать с нуля →</button>`:''}${stage===2?`<div class="at-notice" role="status">${ready?'План готов к обсуждению.':'Готовим ваш план обучения…'}</div>${ready?`<button class="at-primary" onclick="go('plan')">Посмотреть план →</button>`:''}`:''}<p class="at-footnote">Демонстрационный диалог. Модель не подключена.</p>`}
function sendChat(e){e.preventDefault();const text=document.getElementById('at-input').value.trim();if(text)acceptChat(text)}
function acceptChat(text){messages.push({user:true,text});if(stage===0){goal=text;stage=1;messages.push({text:'Что уже знаете по этой теме? Расскажите, что пробовали самостоятельно и где возникли трудности. Можно также указать, как вам удобнее объяснять материал.'});render()}else{stage=2;messages.push({text:'Спасибо! Подготовлю программу с практикой в каждом модуле и самостоятельной итоговой работой.'});render();timer=setTimeout(()=>{ready=true;render()},1100)}}
function toc(course=false){return `<div class="at-toc">${data().topics.map((m,i)=>`<details class="at-module"><summary><span class="at-number">0${i+1}</span><span class="at-module-title">${m[0]}</span><span class="at-chevron" aria-hidden="true">›</span></summary><div class="at-module-body"><ul>${m.slice(1,4).map(x=>`<li>${x}</li>`).join('')}</ul><p><b>Практика</b><br>${m[4]}</p><p><b>Результат</b><br>${i===3?'Самостоятельно выполните итоговую работу.':'Примените темы модуля в задании и получите обратную связь.'}</p>${revision?'<p>Дополнительно: новая задача для самостоятельной практики.</p>':''}${course?`<button class="at-secondary" onclick="lesson=${i};readingPage=0;tab='theory';render()">Открыть модуль →</button>`:''}</div></details>`).join('')}</div>`}
function plan(){return `${context()}${msg('Предлагаю такой маршрут. Раскройте модули, чтобы посмотреть темы и практику. Если хотите что-то изменить — напишите ниже.')}<section class="at-plan"><div class="at-plan-head"><span class="at-eyebrow" style="margin:0">План курса${revision?' · версия 2':''}</span></div><h2 class="at-plan-title">${data().title}</h2><p class="at-muted at-small">${data().result}</p><div class="at-meta"><span>4 модуля</span><span>Практика в каждом модуле</span><span>Итоговая работа</span></div><p class="at-small at-muted">Ваша цель: ${esc(goal||data().goal)}</p>${revision?`<div class="at-notice">Ваше пожелание: «${esc(revision)}». Демо изменения: добавлена дополнительная практика.</div>`:''}${toc()}<div class="at-actions"><button class="at-primary" onclick="startGeneration()">Утвердить план и создать курс →</button></div></section>${composer('Что изменить в плане?','revise')}<p class="at-footnote">Курс начнём создавать после вашего подтверждения плана.</p>`}
function revise(e){e.preventDefault();let text=document.getElementById('at-input').value.trim();if(!text)return;revision=text;render();toast('Демо: пожелание добавлено в план.')}
function startGeneration(){generation=0;screen='generation';render();window.scrollTo(0,0);advanceGeneration()}
function advanceGeneration(){timer=setTimeout(()=>{generation++;render();if(generation<3)advanceGeneration()},900)}
function generating(){const steps=['Подготовка структуры курса','Создание теории и практики',track==='pm'?'Подготовка критериев проверки':'Подготовка репозитория и проверок'];return `${context()}<section class="at-generation">${generation<3?'<div class="at-spinner" aria-hidden="true"></div>':''}<h1>${generation<3?'Готовим ваш курс':'Всё готово. Можно начинать.'}</h1><p class="at-subtitle">${generation<3?'Собираем материалы по утверждённому плану.':'Теория, практика и наставник — в одном месте.'}</p><ol>${steps.map((s,i)=>`<li class="${i<generation?'at-done':i===generation?'at-current':''}"><span>${i<generation?'✓':i===generation?'◌':'·'}</span>${s}</li>`).join('')}</ol>${generation===3?`<button class="at-primary" onclick="go('course')">Открыть курс →</button>`:''}<p class="at-footnote">В макете генерация имитируется. Репозиторий не создаётся.</p></section>`}
function course(){const examLocked=false;return `${context()}${readonly?`<div class="at-readonly">Курс ученика: ${student} · только просмотр <button class="at-quiet" onclick="go('teacher')">← К списку</button></div>`:''}<div class="at-course-layout ${chatOpen?'':'at-chat-closed'}"><div class="at-course-content"><div class="at-course-top"><h1>${data().title}</h1><button class="at-quiet at-chat-launch ${chatOpen?'at-chat-visible':''}" onclick="chatOpen=true;mobileChat=true;render()">Чат с наставником ↗</button></div><div class="at-progress"><span style="width:${lesson*25+((check==='passed'||pmState==='passed')?25:0)}%"></span></div><div class="at-small at-muted">Модуль ${lesson+1} из 4</div><details class="at-module" style="margin-top:15px"><summary><span class="at-module-title">Содержание курса</span><span class="at-chevron">›</span></summary>${toc(true)}</details><div class="at-tabs" role="tablist">${[['theory','Материал'],['practice','Практика'],['history','История']].map(([id,name])=>`<button role="tab" aria-selected="${tab===id}" onclick="tab='${id}';render()">${name}</button>`).join('')}</div><section class="at-lesson">${tab==='theory'?theory():tab==='practice'?practice():historyView()}</section></div>${chatOpen?`<button class="at-chat-shade ${mobileChat?'':'at-mobile-rest'}" aria-label="Закрыть панель чата" onclick="mobileChat=false;chatOpen=false;render()"></button><aside class="at-chat-panel ${mobileChat?'':'at-mobile-rest'}" aria-label="Чат с наставником"><div class="at-chat-head"><div><h2>Ваш наставник</h2><small>${data().short} · ${examLocked?'самостоятельная проверка':'поможет разобраться'}</small></div><button class="at-close" aria-label="Закрыть чат" onclick="chatOpen=false;mobileChat=false;render()">×</button></div>${examLocked?`<div class="at-chat-lock"><h3>Сейчас — самостоятельно</h3>На итоговом тесте подсказки недоступны. Обсудим результат после завершения.</div>`:`<div class="at-chat-scroll">${msg('Если что-то непонятно, спросите здесь. Можно обсудить материал, практику или замечания к работе.')}${courseMessages.map(x=>msg(x,true)).join('')}</div>${readonly?'<div class="at-chat-lock">История переписки · только просмотр.</div>':composer('Вопрос наставнику…','askCourse','at-course-input')}<p class="at-footnote">Демо: модель не подключена.</p>`}</aside>`:''}</div>`}
function theory(){const page=readingPages[track][readingPage],state=readingState(),done=Object.values(readingStates).filter(x=>x.key.startsWith(track+':'+lesson+':')&&x.done).length;return `<article class="at-reading"><div class="at-reading-top"><span class="at-eyebrow">Модуль 0${lesson+1} · ${data().topics[lesson][0]}</span><span class="at-small at-muted">Страница ${readingPage+1} из ${readingPages[track].length}</span></div><div class="at-page-steps" aria-label="Страницы материала">${readingPages[track].map((v,i)=>`<button class="${readingPage===i?'current':''}" aria-label="Страница ${i+1}: ${v.title}" aria-current="${readingPage===i?'page':'false'}" onclick="changePage(${i})"><span>${i+1}</span>${v.short}</button>`).join('')}</div><h2>${page.title}</h2><p>${page.intro}</p>${page.code?`<pre><code>${esc(page.code)}</code></pre>`:`<div class="at-notice">${page.example}</div>`}<p>${page.before}</p>${inlineQuiz()}${state.done?`<div class="at-reading-followup"><h3>${page.afterTitle}</h3><p>${page.after}</p></div>`:''}<nav class="at-page-nav" aria-label="Переход между страницами"><button class="at-secondary" ${readingPage===0?'disabled':''} onclick="changePage(readingPage-1)">← Назад</button><span>${readingPage+1} / ${readingPages[track].length}</span>${readingPage<readingPages[track].length-1?`<button class="at-primary" onclick="changePage(readingPage+1)">Далее →</button>`:`<button class="at-primary" onclick="tab='practice';render();scrollToLesson()">К практике →</button>`}</nav><p class="at-footnote">Вопросы по ходу чтения: ${done} из 3 разобрано. Можно вернуться к любой странице.</p><p class="at-footnote">Демонстрационный фрагмент. Ответы сохраняются при переходах внутри макета до обновления страницы.</p></article>`}
function checkRow(status,title,note,type){return `<div class="at-check"><span class="${status==='ok'?'at-ok':status==='fail'?'at-fail':''}">${status==='ok'?'✓':status==='fail'?'×':'◌'}</span><div>${title}<small>${note}</small></div>${type?`<button class="at-link" onclick="showDetails('${type}')" aria-label="Открыть ${title}">↗</button>`:''}</div>`}
function practice(){return `<div class="at-eyebrow">Модуль 0${lesson+1} · практическое задание</div><h2>${data().topics[lesson][0]}</h2><p>${data().topics[lesson][4]}</p>${track==='pm'?pmPractice():codePractice()}`}
function codePractice(){return `<button class="at-quiet" onclick="showDetails('repo')">Как работать с учебным репозиторием ↗</button><div class="at-checks">${checkRow(check==='failed'?'fail':check==='running'?'wait':'ok',check==='running'?'CI проверяет решение':check==='failed'?'CI завершился с ошибкой':'CI: все тесты пройдены',check==='failed'?(track==='python'?'Пустое название должно отклоняться.':'Ожидаемые изменения отсутствуют в ветке.'):'Pull request #1 · коммит a81c4f2','CI')}${checkRow(check==='passed'?'ok':check==='changes'?'fail':'wait',check==='passed'?'Ревьюер одобрил решение':check==='changes'?'Ревьюер просит исправления':'Ревью решения',check==='changes'?(track==='python'?'Проверьте название, состоящее только из пробелов.':'Добавьте в описание PR цель изменения.'):check==='passed'?'Approve для коммита a81c4f2':'Ожидаем результат проверки.','PR')}${checkRow(check==='passed'?'ok':'wait',check==='passed'?'Изменения объединены':'Автоматическое объединение',check==='passed'?'Задание зачтено. Можно продолжать.':'После успешного CI и одобрения текущей версии.')}</div>${check==='passed'?`<button class="at-primary" ${readonly?'disabled':''} onclick="nextLesson()">Следующий модуль →</button>`:''}<details class="at-demo-controls"><summary>Демо: состояния проверки</summary><div class="at-chips">${[['running','Проверяется'],['failed','Ошибка CI'],['changes','Нужны исправления'],['passed','Зачтено']].map(([id,name])=>`<button class="at-chip" onclick="check='${id}';render()">${name}</button>`).join('')}</div></details>`}
function pmPractice(){return `<label for="at-pm" class="at-small at-muted">Ваше решение</label><textarea id="at-pm" class="at-answer" oninput="pmAnswer=this.value" ${readonly?'disabled':''} placeholder="Опишите цель, задачи, сроки и риски…">${esc(pmAnswer)}</textarea><div class="at-actions"><button class="at-primary" ${readonly?'disabled':''} onclick="submitPM()">Отправить на ревью →</button></div>${pmState?`<div class="at-notice">${pmState==='review'?'Ревьюер проверяет работу…':pmState==='passed'?'✓ Работа зачтена. Цель и критерии результата описаны.':'Нужны исправления: добавьте срок и критерий завершения проекта.'}</div>`:''}<details class="at-demo-controls"><summary>Демо: ответ ревьюера</summary><div class="at-chips"><button class="at-chip" onclick="pmState='changes';render()">Нужны исправления</button><button class="at-chip" onclick="pmState='passed';render()">Зачтено</button></div></details>`}
function submitPM(){if(!pmAnswer.trim()){toast('Сначала добавьте своё решение.');return}pmState='review';render();timer=setTimeout(()=>{pmState='changes';render()},900)}
function nextLesson(){readingPage=0;lesson=Math.min(3,lesson+1);check='running';pmState='';tab='theory';render()}
function askCourse(e){e.preventDefault();let v=document.getElementById('at-course-input').value.trim();if(v){courseMessages.push(v);render();toast('Сообщение добавлено. В макете модель не подключена.')}}
function historyView(){return `<h2>История обучения</h2><div class="at-toc"><details class="at-module" open><summary><span class="at-module-title">Входное интервью</span><span class="at-chevron">›</span></summary><div class="at-module-body"><p><b>Наставник</b><br>Что вы уже пробовали делать?</p><p><b>Ученик</b><br>${track==='pm'?'Помогала с мероприятием, но сама план ещё не составляла.':'Основы знаю. Хочу больше самостоятельной практики.'}</p></div></details><details class="at-module"><summary><span class="at-module-title">План и его подтверждение</span><span class="at-chevron">›</span></summary><div class="at-module-body">План прошёл ревью. Ученик подтвердил состав курса.</div></details><details class="at-module"><summary><span class="at-module-title">Практика · первая попытка</span><span class="at-chevron">›</span></summary><div class="at-module-body">Ревьюер запросил изменения. Выдана подсказка. Самостоятельное освоение пока не подтверждено.</div></details></div><p class="at-footnote">Пример истории. В приложении сохраняются реальные вопросы, ответы и проверки.</p>`}
function teacher(){return `<button class="at-back" onclick="go('mentors')">← Наставники</button><div class="at-eyebrow">Кабинет преподавателя</div><h1>Ученики</h1><p class="at-subtitle">Цели, прогресс и история обучения.</p><div class="at-students">${[['Илья','python','Научиться писать API','25%'],['Анна','pm','Освоить управление проектами','50%'],['Михаил','git','Разобраться с ветками','0%']].map(([name,key,g,p])=>`<button class="at-student" onclick="viewStudent('${key}','${name}')"><div>${name}<small>${g}</small></div><span class="at-muted at-small">${p} &nbsp; ↗</span></button>`).join('')}</div><p class="at-footnote">Демонстрационные ученики · просмотр без действий от их имени.</p>`}

function toast(text){const node=document.getElementById('at-live');node.innerHTML=`<div class="at-toast">${esc(text)}</div>`;setTimeout(()=>node.innerHTML='',3200)}

function readingState(){const key=track+':'+lesson+':'+readingPage;return readingStates[key]||(readingStates[key]={key,selected:-1,attempts:0,feedback:'',done:false})}
function scrollToLesson(){document.querySelector('.at-tabs')?.scrollIntoView({block:'start',behavior:'instant'})}
function changePage(index){readingPage=Math.max(0,Math.min(readingPages[track].length-1,index));render();scrollToLesson()}
function chooseAnswer(i){const state=readingState();if(readonly||state.done)return;state.selected=i;render();document.querySelector('#at-choice-'+i)?.focus({preventScroll:true})}
function submitQuiz(){const state=readingState(),q=quizSets[track][readingPage];if(readonly||state.selected<0||state.done)return;state.attempts++;if(state.selected===q.answer){state.done=true;state.feedback='correct'}else if(state.attempts===1){state.feedback='hint'}else{state.done=true;state.feedback='solution'}render();document.querySelector('.at-feedback')?.scrollIntoView({block:'nearest',behavior:'instant'})}
function inlineQuiz(){const q=quizSets[track][readingPage],state=readingState();return `<section class="at-quiz at-inline-quiz" aria-label="Вопрос по материалу"><div class="at-eyebrow">Проверьте себя</div><h3>${q.title}</h3>${q.text?`<p class="at-small at-muted">${q.text}</p>`:''}${q.code?`<pre><code>${esc(q.code).replaceAll('\n','\n')}</code></pre>`:''}<fieldset><legend>Выберите один ответ</legend>${q.options.map((answer,i)=>`<label class="at-option ${state.done?(i===q.answer?'is-correct':i===state.selected?'is-wrong':''):''}"><input id="at-choice-${i}" type="radio" name="quiz-answer" value="${i}" ${state.selected===i?'checked':''} ${state.done||readonly?'disabled':''} onchange="chooseAnswer(${i})"><span class="at-option-text">${esc(answer)}</span>${state.done&&i===q.answer?'<span class="at-answer-mark">✓</span>':''}</label>`).join('')}</fieldset>${state.feedback?`<div class="at-feedback ${state.feedback==='hint'?'is-hint':''}" role="status"><strong>${state.feedback==='hint'?'Пока не совсем. Попробуйте ещё раз.':state.feedback==='correct'?'Верно':'Разберём ответ вместе'}</strong><p>${state.feedback==='hint'?q.hint:q.why}</p>${state.feedback==='solution'?'<p>Этот вопрос пройден с помощью.</p>':''}</div>`:''}<div class="at-quiz-actions"><span>${state.done?(state.attempts>1?'Разобрано с помощью':'Решено самостоятельно'):readonly?'Только просмотр':state.attempts?'Попытка '+state.attempts:'Вопрос по прочитанному материалу'}</span>${!state.done?`<button class="at-primary" ${state.selected<0||readonly?'disabled':''} onclick="submitQuiz()">Проверить ответ →</button>`:''}</div></section>`}

render();
