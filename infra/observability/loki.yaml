# Loki for local logs: monolithic, filesystem storage, OTLP ingestion at /otlp.
auth_enabled: false
server:
  http_listen_port: 3100
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
ingester:
  wal:
    # Docker Desktop VMs often run above 90% disk usage, where Loki's default
    # threshold stops accepting writes. Local PoC only.
    disk_full_threshold: 0.99
limits_config:
  allow_structured_metadata: true
analytics:
  reporting_enabled: false
