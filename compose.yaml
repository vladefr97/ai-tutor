name: tutor-app

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: tutor
      POSTGRES_DB: tutor
    ports: ["127.0.0.1:5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor -d tutor"]
      interval: 2s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes: [maildata:/data]

  s3:
    image: versity/versitygw:v1.10.0
    environment:
      ROOT_ACCESS_KEY: ${S3_ACCESS_KEY:-tutor}
      ROOT_SECRET_KEY: ${S3_SECRET_KEY:-tutor-secret}
    command: ["posix", "/data"]
    ports: ["127.0.0.1:7070:7070"]
    volumes: [s3data:/data]

  backend:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
      mailpit: { condition: service_started }
      s3: { condition: service_started }
    env_file: .env
    environment:
      DATABASE_URL: postgres://tutor:tutor@postgres:5432/tutor
      SMTP_ADDR: mailpit:1025
      AUTH_PEPPER: ${AUTH_PEPPER:-local-dev-pepper}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-teacher@example.com}
      S3_ENDPOINT: http://s3:7070
      AGENT_FAKE: ${AGENT_FAKE:-0}
      AGENT_CONFIG_DIR: /agent-config
      # Agent containers are started on the host Docker; session dirs must have
      # the same absolute path for the backend and for the host (see Makefile).
      AGENT_SESSIONS_DIR: ${AGENT_DATA_DIR:-${PWD}/.data/agents}
    volumes:
      - ./agent-config:/agent-config:ro
      - ${AGENT_DATA_DIR:-${PWD}/.data/agents}:${AGENT_DATA_DIR:-${PWD}/.data/agents}
      - /var/run/docker.sock:/var/run/docker.sock
    ports: ["127.0.0.1:8080:8080"]

volumes:
  pgdata:
  maildata:
  s3data:
