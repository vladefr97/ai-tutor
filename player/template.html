<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Плеер курса</title>
<style>
:root { color-scheme: light dark; --bg:#fafaf8; --fg:#1d1d1b; --muted:#6b6b66; --card:#fff; --line:#e2e2dc; --accent:#2f6fdb; --trap-bg:#fff4e0; --trap-line:#e0a030; }
@media (prefers-color-scheme: dark) { :root { --bg:#16171a; --fg:#e8e8e4; --muted:#9a9a94; --card:#1f2024; --line:#33343a; --accent:#6ea0f5; --trap-bg:#2d2412; --trap-line:#b8862b; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; }
a { color:var(--accent); }
header, main { max-width:1100px; margin:0 auto; padding:16px; }
header h1 { font-size:1.2rem; margin:0; }
.topic-list { list-style:none; padding:0; display:grid; gap:12px; }
.topic-list a { display:block; padding:16px; background:var(--card); border:1px solid var(--line); border-radius:10px; color:inherit; text-decoration:none; }
.topic-list a:hover { border-color:var(--accent); }
.muted { color:var(--muted); font-size:.9rem; }
.layout { display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:start; }
@media (max-width:760px) { .layout { grid-template-columns:1fr; } }
.col { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 20px 20px; min-width:0; }
.col h2:first-child { margin-top:12px; }
.task { border-top:1px solid var(--line); padding:12px 0; }
.task:first-of-type { border-top:0; }
.trap { background:var(--trap-bg); border-left:4px solid var(--trap-line); margin:16px 0; padding:4px 16px; border-radius:4px; }
.opts { display:grid; gap:8px; } ol.items { padding-left:1.4em; } button { font:inherit; padding:6px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); cursor:pointer; text-align:left; } button:disabled { opacity:.5; cursor:default; } textarea { width:100%; font:inherit; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px; } .ok { color:#2a8a4a; } .fail { color:#c0392b; }
</style>
</head>
<body>
<header><h1><a href="#" id="home">Плеер курса</a></h1></header>
<main id="app"></main>
<script>
const COURSE = /*COURSE_JSON*/null;

const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const inline = s => esc(s)
  .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
  .replace(/\*(.+?)\*/g, "<em>$1</em>");

// Минимальный markdown: заголовки, абзацы, списки, выделение, «> **Ловушка.** …»
function renderMd(md) {
  const out = [];
  let para = [], list = null, quote = [];
  const flush = () => {
    if (para.length) out.push("<p>" + inline(para.join(" ")) + "</p>");
    if (list) out.push(`<${list.tag}>` + list.items.map(i => "<li>" + inline(i) + "</li>").join("") + `</${list.tag}>`);
    if (quote.length) {
      const text = quote.join(" ");
      out.push(`<blockquote class="${/^\*\*Ловушка/.test(text) ? "trap" : ""}"><p>${inline(text)}</p></blockquote>`);
    }
    para = []; list = null; quote = [];
  };
  for (const line of md.split("\n")) {
    let m;
    if (!line.trim()) flush();
    else if ((m = line.match(/^(#{1,3})\s+(.*)/))) { flush(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); }
    else if ((m = line.match(/^>\s?(.*)/))) { if (!quote.length) flush(); quote.push(m[1]); }
    else if ((m = line.match(/^\s*(?:([-*])|\d+\.)\s+(.*)/))) {
      const tag = m[1] ? "ul" : "ol";
      if (!list || list.tag !== tag) { flush(); list = { tag, items: [] }; }
      list.items.push(m[2]);
    } else { if (list || quote.length) flush(); para.push(line.trim()); }
  }
  flush();
  return out.join("\n");
}

/*GRADE_JS*/

// ---- состояние: answers[topicId][taskId] = {status: ok|fail|skip, tries, text?, order?}
const KEY = "tutor:" + COURSE.title;
let state = { answers: {} };
try { state = JSON.parse(localStorage.getItem(KEY)) || state; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const rec = (tp, tk) => ((state.answers[tp] ||= {})[tk] ||= { tries: 0 });
const done = topic => topic.tasks.every(t => ["ok", "skip"].includes(rec(topic.id, t.id).status));

function shuffled(items) {
  const a = items.slice();
  do { a.sort(() => Math.random() - 0.5); } while (a.length > 1 && a.every((x, i) => x === items[i]));
  return a;
}

function renderTask(topic, t) {
  const r = rec(topic.id, t.id);
  const d = `data-topic="${esc(topic.id)}" data-task="${esc(t.id)}"`;
  let body = "";
  if (r.status === "skip") {
    body = `<p class="muted">Пропущено.</p><button data-action="unskip" ${d}>Вернуться к заданию</button>`;
  } else {
    if (t.kind === "quiz") {
      body = "<div class='opts'>" + t.opts.map((o, i) =>
        `<button data-action="pick" data-i="${i}" ${d} ${r.status === "ok" ? "disabled" : ""}>${inline(o)}</button>`).join("") + "</div>";
    } else if (t.kind === "order") {
      const cur = r.order || (r.order = shuffled(t.items));
      body = "<ol class='items'>" + cur.map((o, i) => `<li>${inline(o)} ` +
        `<button data-action="up" data-i="${i}" ${d} aria-label="Выше" ${i === 0 || r.status === "ok" ? "disabled" : ""}>↑</button>` +
        `<button data-action="down" data-i="${i}" ${d} aria-label="Ниже" ${i === cur.length - 1 || r.status === "ok" ? "disabled" : ""}>↓</button></li>`).join("") + "</ol>" +
        (r.status === "ok" ? "" : `<button data-action="check" ${d}>Проверить порядок</button>`);
    } else {
      body = `<textarea data-action="text" ${d} rows="4" placeholder="Ваш ответ">${esc(r.text || "")}</textarea>` +
        "<p class='muted'>Проверка открытых ответов появится позже.</p>";
    }
    if (r.status === "ok") body += `<p class="ok">Засчитано. ${inline(t.why || "")}</p>`;
    else if (r.status === "fail") body += `<p class="fail">Не засчитано, попробуйте ещё раз.</p>`;
    if (r.status !== "ok") body += ` <button data-action="skip" ${d}>Пропустить</button>`;
  }
  return `<div class="task"><p><strong>${inline(t.q)}</strong></p>${body}</div>`;
}

function render() {
  const app = document.getElementById("app");
  const id = decodeURIComponent(location.hash.slice(1));
  const topic = COURSE.topics.find(t => t.id === id);
  document.title = topic ? topic.title : COURSE.title;
  if (!topic) {
    const n = COURSE.topics.filter(done).length;
    app.innerHTML = `<h1>${esc(COURSE.title)}</h1><p class="muted">${esc(COURSE.brief)}</p>` +
      `<p><strong>Пройдено тем: ${n} из ${COURSE.topics.length}</strong></p><ul class="topic-list">` +
      COURSE.topics.map((t, i) => `<li><a href="#${encodeURIComponent(t.id)}"><strong>${i + 1}. ${esc(t.title)}</strong>` +
        `<div class="muted">${t.final ? "Итоговое задание" : "Шпаргалка"} · заданий: ${t.tasks.length}${done(t) ? " · ✓ пройдена" : ""}</div></a></li>`).join("") + "</ul>";
    return;
  }
  const cheat = topic.cheatsheet ? `<section class="col">${renderMd(topic.cheatsheet)}</section>` : "";
  app.innerHTML = `<p><a href="#">← Все темы</a></p><div class="layout">${cheat}` +
    `<section class="col"><h2>Задания${done(topic) ? " · ✓ тема пройдена" : ""}</h2>${topic.tasks.map(t => renderTask(topic, t)).join("")}</section></div>`;
}

document.addEventListener("click", e => {
  const b = e.target.closest("button[data-action]");
  if (!b) return;
  const topic = COURSE.topics.find(t => t.id === b.dataset.topic);
  const task = topic.tasks.find(t => t.id === b.dataset.task);
  const r = rec(topic.id, task.id), i = +b.dataset.i;
  const a = b.dataset.action;
  if (a === "pick") { r.tries++; r.status = grade(task, i) ? "ok" : "fail"; }
  else if (a === "up" || a === "down") { const j = a === "up" ? i - 1 : i + 1; [r.order[i], r.order[j]] = [r.order[j], r.order[i]]; r.status = undefined; }
  else if (a === "check") { r.tries++; r.status = grade(task, r.order) ? "ok" : "fail"; }
  else if (a === "skip") r.status = "skip";
  else if (a === "unskip") r.status = undefined;
  save(); render();
});
document.addEventListener("input", e => {
  const el = e.target.closest("textarea[data-action=text]");
  if (el) { rec(el.dataset.topic, el.dataset.task).text = el.value; save(); }
});
addEventListener("hashchange", render);
render();
</script>
</body>
</html>
