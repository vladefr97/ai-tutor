<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Плеер курса</title>
<style>
:root { color-scheme: light dark; --bg:#fafaf8; --fg:#1d1d1b; --muted:#6b6b66; --card:#fff; --line:#e2e2dc; --accent:#2f6fdb; --trap-bg:#fff4e0; --trap-line:#e0a030; }
@media (prefers-color-scheme: dark) { :root { --bg:#16171a; --fg:#e8e8e4; --muted:#9a9a94; --card:#1f2024; --line:#33343a; --accent:#6ea0f5; --trap-bg:#2d2412; --trap-line:#b8862b; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; }
a { color:var(--accent); }
header, main { max-width:1100px; margin:0 auto; padding:16px; }
header h1 { font-size:1.2rem; margin:0; }
.topic-list { list-style:none; padding:0; display:grid; gap:12px; }
.topic-list a { display:block; padding:16px; background:var(--card); border:1px solid var(--line); border-radius:10px; color:inherit; text-decoration:none; }
.topic-list a:hover { border-color:var(--accent); }
.muted { color:var(--muted); font-size:.9rem; }
.layout { display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:start; }
@media (max-width:760px) { .layout { grid-template-columns:1fr; } }
.col { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 20px 20px; min-width:0; }
.col h2:first-child { margin-top:12px; }
.task { border-top:1px solid var(--line); padding:12px 0; }
.task:first-of-type { border-top:0; }
.trap { background:var(--trap-bg); border-left:4px solid var(--trap-line); margin:16px 0; padding:4px 16px; border-radius:4px; }
.opts { display:grid; gap:8px; } ol.items { padding-left:1.4em; } button { font:inherit; padding:6px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); cursor:pointer; text-align:left; } button:disabled { opacity:.5; cursor:default; } textarea { width:100%; font:inherit; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px; } .ok { color:#2a8a4a; } .fail { color:#c0392b; }

.drawer { position:fixed; top:0; right:0; bottom:0; width:min(400px,100vw); background:var(--card); border-left:1px solid var(--line); display:none; flex-direction:column; z-index:10; }
.drawer.open { display:flex; }
.drawer header { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); max-width:none; margin:0; }
#msgs { flex:1; overflow-y:auto; padding:12px 16px; }
.msg { margin:8px 0; padding:8px 12px; border-radius:10px; background:var(--bg); white-space:pre-wrap; }
.msg.user { background:var(--accent); color:#fff; margin-left:2rem; }
.drawer form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); }
.drawer input { flex:1; min-width:0; font:inherit; padding:8px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); }
#mentor-btn { position:fixed; right:16px; bottom:16px; z-index:5; }
.err { color:#c0392b; }
</style>
</head>
<body>
<header><h1><a href="#" id="home">Плеер курса</a></h1></header>
<main id="app"></main>
<button id="mentor-btn" data-action="mentor-toggle" hidden></button>
<aside id="mentor" class="drawer" aria-label="Наставник">
  <header><strong id="mentor-name"></strong><button data-action="mentor-close" aria-label="Закрыть">✕</button></header>
  <div id="msgs"></div>
  <form id="mentor-form"><input id="mentor-input" placeholder="Спросите по теме" autocomplete="off"><button id="mentor-send">Отправить</button></form>
</aside>
<script>
const COURSE = /*COURSE_JSON*/null;

const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const inline = s => esc(s)
  .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
  .replace(/\*(?=\S)(.+?)(?<=\S)\*/g, "<em>$1</em>");

// Минимальный markdown: заголовки, абзацы, списки, выделение, «> **Ловушка.** …»
function renderMd(md) {
  const out = [];
  let para = [], list = null, quote = [];
  const flush = () => {
    if (para.length) out.push("<p>" + inline(para.join(" ")) + "</p>");
    if (list) out.push(`<${list.tag}>` + list.items.map(i => "<li>" + inline(i) + "</li>").join("") + `</${list.tag}>`);
    if (quote.length) {
      const text = quote.join(" ");
      out.push(`<blockquote class="${/^\*\*Ловушка/.test(text) ? "trap" : ""}"><p>${inline(text)}</p></blockquote>`);
    }
    para = []; list = null; quote = [];
  };
  for (const line of md.split("\n")) {
    let m;
    if (!line.trim()) flush();
    else if ((m = line.match(/^(#{1,3})\s+(.*)/))) { flush(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); }
    else if ((m = line.match(/^>\s?(.*)/))) { if (!quote.length) flush(); quote.push(m[1]); }
    else if ((m = line.match(/^\s*(?:([-*])|\d+\.)\s+(.*)/))) {
      const tag = m[1] ? "ul" : "ol";
      if (!list || list.tag !== tag) { flush(); list = { tag, items: [] }; }
      list.items.push(m[2]);
    } else { if (list || quote.length) flush(); para.push(line.trim()); }
  }
  flush();
  return out.join("\n");
}

/*GRADE_JS*/

// ---- состояние: answers[topicId][taskId] = {status: ok|fail|skip, tries, text?, note?, order?, last?}; mentor[topicId] = [{role, content, hidden?}]
const KEY = "tutor:" + COURSE.title;
let state = { answers: {}, mentor: {} };
try { state = { ...state, ...JSON.parse(localStorage.getItem(KEY)) }; } catch (e) {}
const L = COURSE.learner;

// Прогресс темы: data/users/<id>/progress-<topicId>. Без db или user страница живёт на localStorage.
let remote = null, sampleFn = null;
const timers = {}, touched = new Set();
function push(topicId) {
  clearTimeout(timers[topicId]); delete timers[topicId];
  const doc = JSON.parse(JSON.stringify({ answers: state.answers[topicId] || {}, mentor: state.mentor[topicId] || [] }));
  remote.doc("progress-" + topicId).set(doc).catch(() => {});
}
function save(topicId) {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  if (!topicId) return;
  touched.add(topicId);
  if (!remote) return;
  clearTimeout(timers[topicId]);
  timers[topicId] = setTimeout(() => push(topicId), 500);
}
const flush = () => remote && Object.keys(timers).forEach(push);
addEventListener("pagehide", flush);
document.addEventListener("visibilitychange", () => document.visibilityState === "hidden" && flush());
const use = async n => { try { return (await window.claude?.use?.(n)) || null; } catch (e) { return null; } };
(async () => {
  const [db, user] = await Promise.all([use("db"), use("user")]);
  sampleFn = await use("sample");
  try {
    const id = db && user && await user.id();
    if (id) {
      remote = db.collection("data/users/" + id);
      await Promise.all(COURSE.topics.map(async t => {
        const s = await remote.doc("progress-" + t.id).get();
        if (!s.exists || touched.has(t.id)) return;
        const d = s.data();
        if (d.answers) state.answers[t.id] = d.answers;
        if (d.mentor) state.mentor[t.id] = d.mentor;
      }));
      touched.forEach(push);
    }
  } catch (e) { remote = null; }
  render();
})();

const rec = (tp, tk) => ((state.answers[tp] ||= {})[tk] ||= { tries: 0 });
const done = topic => topic.tasks.every(t => ["ok", "skip"].includes(rec(topic.id, t.id).status));
const busy = new Set();
const errText = e => e && e.code === "not_granted"
  ? "Вы не разрешили странице обращаться к Claude. Разрешение можно выдать в меню разрешений артефакта."
  : "Не получилось связаться с Claude. Попробуйте позже.";

function shuffled(items) {
  const a = items.slice();
  do { a.sort(() => Math.random() - 0.5); } while (a.length > 1 && a.every((x, i) => x === items[i]));
  return a;
}

function renderTask(topic, t) {
  const r = rec(topic.id, t.id);
  const d = `data-topic="${esc(topic.id)}" data-task="${esc(t.id)}"`;
  const wait = busy.has(topic.id + "/" + t.id);
  let body = "";
  if (r.status === "skip") {
    body = `<p class="muted">Пропущено.</p><button data-action="unskip" ${d}>Вернуться к заданию</button>`;
  } else {
    if (t.kind === "quiz") {
      body = "<div class='opts'>" + t.opts.map((o, i) =>
        `<button data-action="pick" data-i="${i}" ${d} ${r.status === "ok" ? "disabled" : ""}>${inline(o)}</button>`).join("") + "</div>";
    } else if (t.kind === "order") {
      const cur = r.order || (r.order = shuffled(t.items));
      body = "<ol class='items'>" + cur.map((o, i) => `<li>${inline(o)} ` +
        `<button data-action="up" data-i="${i}" ${d} aria-label="Выше" ${i === 0 || r.status === "ok" ? "disabled" : ""}>↑</button>` +
        `<button data-action="down" data-i="${i}" ${d} aria-label="Ниже" ${i === cur.length - 1 || r.status === "ok" ? "disabled" : ""}>↓</button></li>`).join("") + "</ol>" +
        (r.status === "ok" ? "" : `<button data-action="check" ${d}>Проверить порядок</button>`);
    } else {
      body = `<textarea data-action="text" ${d} rows="4" placeholder="Ваш ответ" ${r.status === "ok" ? "disabled" : ""}>${esc(r.text || "")}</textarea>` +
        (r.status === "ok" ? "" : sampleFn
          ? `<button data-action="check-open" ${d} ${wait ? "disabled" : ""}>${wait ? "Проверяю…" : "Проверить"}</button>`
          : "<p class='muted'>Проверка ответа недоступна: нет доступа к Claude.</p>");
    }
    if (r.status === "ok") body += `<p class="ok">Засчитано. ${inline(t.kind === "open" ? r.note || "" : t.why || "")}</p>`;
    else if (r.status === "fail") body += `<p class="fail">Не засчитано.${t.kind === "open" && r.note ? " " + inline(r.note) : " Попробуйте ещё раз."}</p>`;
    else if (r.note) body += `<p class="err">${esc(r.note)}</p>`;
    if (r.status === "fail" && r.tries >= 2 && sampleFn) body += ` <button data-action="reveal" ${d}>Показать разбор</button>`;
    if (r.status !== "ok") body += ` <button data-action="skip" ${d}>Пропустить</button>`;
  }
  return `<div class="task"><p><strong>${inline(t.q)}</strong></p>${body}</div>`;
}

let mentorUnread = false, mentorOpen = false, mentorBusy = false, mentorDraft = null, mentorError = "";
const curTopic = () => {
  let id = location.hash.slice(1);
  try { id = decodeURIComponent(id); } catch (e) {}
  return COURSE.topics.find(t => t.id === id);
};

function render() {
  const app = document.getElementById("app");
  const topic = curTopic();
  document.title = topic ? topic.title : COURSE.title;
  if (!topic) {
    const n = COURSE.topics.filter(done).length;
    app.innerHTML = `<h1>${esc(COURSE.title)}</h1><p class="muted">${esc(COURSE.brief)}</p>` +
      `<p><strong>Пройдено тем: ${n} из ${COURSE.topics.length}</strong></p><ul class="topic-list">` +
      COURSE.topics.map((t, i) => `<li><a href="#${encodeURIComponent(t.id)}"><strong>${i + 1}. ${esc(t.title)}</strong>` +
        `<div class="muted">${t.final ? "Итоговое задание" : "Шпаргалка"} · заданий: ${t.tasks.length}${done(t) ? " · ✓ пройдена" : ""}</div></a></li>`).join("") + "</ul>";
  } else {
    const cheat = topic.cheatsheet ? `<section class="col">${renderMd(topic.cheatsheet)}</section>` : "";
    app.innerHTML = `<p><a href="#">← Все темы</a></p><div class="layout">${cheat}` +
      `<section class="col"><h2>Задания${done(topic) ? " · ✓ тема пройдена" : ""}</h2>${topic.tasks.map(t => renderTask(topic, t)).join("")}</section></div>`;
  }
  renderMentor();
}

// ---- Наставник
function secret(t) {
  if (t.kind === "quiz") return `верный вариант: ${t.opts[t.answer]}. Объяснение: ${t.why}`;
  if (t.kind === "order") return `верный порядок: ${t.items.join(" → ")}. Объяснение: ${t.why}`;
  return `критерий проверки: ${t.rubric}`;
}
function mentorInstruction(topic) {
  const tasks = topic.tasks.map(t => {
    const r = rec(topic.id, t.id);
    return `- ${t.q} (${t.kind}); статус: ${r.status || "не решено"}, попыток: ${r.tries}` +
      (r.text ? `; ответ ученика: ${r.text}` : r.last ? `; последний ответ ученика: ${r.last}` : "") +
      `\n  [скрыто от ученика] ${secret(t)}`;
  }).join("\n");
  return `Ты — Наставник по имени ${L.mentor}, помогаешь ученику по теме «${topic.title}» курса «${COURSE.title}». ` +
    `Ученика зовут ${L.name}, обращайся на «${L.address}». Тон: ${L.tone}. Смайлики: ${L.emoji}. Формат объяснений: ${L.format}. Пожелания: ${L.wishes}.\n\n` +
    `Правила: отвечай по-русски, 2–5 предложений. Не называй правильный ответ задания, пока ученик сам не попросил разбор: задавай наводящие вопросы и давай намёки. ` +
    `Когда ученик просит разбор, объясни правильный ответ и почему он такой. Не выходи за тему.\n\n` +
    `Шпаргалка темы:\n${topic.cheatsheet || "(у темы нет шпаргалки)"}\n\nЗадания и состояние ученика:\n${tasks}`;
}
async function mentorSend(topic, content, hidden) {
  if (!sampleFn || mentorBusy) return;
  const hist = (state.mentor[topic.id] ||= []);
  hist.push({ role: "user", content, hidden: !!hidden });
  mentorBusy = true; mentorDraft = ""; mentorError = ""; renderMentor();
  try {
    const input = [{ role: "user", content: mentorInstruction(topic) }, { role: "assistant", content: "Понял, помогу по этим правилам." },
      ...hist.map(({ role, content }) => ({ role, content }))];
    const res = await sampleFn(input, { modelTier: "quick", cache: false, onText: u => { mentorDraft = u.text; renderMentor(); } });
    hist.push({ role: "assistant", content: res.text });
  } catch (e) { hist.pop(); mentorError = errText(e); }
  mentorBusy = false; mentorDraft = null; if (!mentorOpen) mentorUnread = true; save(topic.id); renderMentor();
}
function renderMentor() {
  const topic = curTopic();
  const btn = document.getElementById("mentor-btn"), box = document.getElementById("mentor");
  btn.hidden = !(topic && sampleFn);
  btn.textContent = "Наставник: " + L.mentor + (mentorUnread ? " ●" : "");
  box.classList.toggle("open", !!(topic && sampleFn && mentorOpen));
  if (!topic) return;
  document.getElementById("mentor-name").textContent = L.mentor;
  document.getElementById("mentor-send").disabled = mentorBusy;
  const msgs = (state.mentor[topic.id] || []).filter(m => !m.hidden);
  const fmt = (c, cls) => `<div class="msg ${cls}">${esc(c)}</div>`;
  const el = document.getElementById("msgs");
  el.innerHTML = msgs.map(m => fmt(m.content, m.role)).join("") +
    (mentorBusy ? fmt(mentorDraft || "Думаю…", "assistant") : "") +
    (mentorError ? `<div class="msg err">${esc(mentorError)}</div>` : "");
  el.scrollTop = el.scrollHeight;
}
function autoHint(topic, task, r) {
  mentorSend(topic, `Ученик ответил на задание «${task.q}» так: «${r.text || r.last}». Это не засчитано. ` +
    `Подскажи, где ошибка, наводящим вопросом или намёком, не называя правильный ответ. Не здоровайся заново.`, true);
}

async function checkOpen(topic, task, r) {
  if (!(r.text || "").trim()) { r.note = "Сначала напишите ответ."; render(); return; }
  const key = topic.id + "/" + task.id;
  busy.add(key); r.note = ""; render();
  try {
    const v = await sampleFn.json(
      `Ты проверяешь ответ ученика на открытый вопрос по критерию.\nВопрос: ${task.q}\nКритерий: ${task.rubric}\nОтвет ученика: ${r.text || "(пусто)"}\n\n` +
      `Верни только JSON {"ok": true или false, "comment": "1–2 предложения ученику на «${L.address}», в тоне: ${L.tone}"}. ` +
      `Если не засчитал, скажи, чего не хватает, но не пересказывай полный правильный ответ.`,
      { modelTier: "quick", cache: false });
    r.tries++; r.status = v.ok === true ? "ok" : "fail"; r.note = String(v.comment || "");
  } catch (e) { r.note = errText(e); }
  busy.delete(key); save(topic.id); render();
  if (r.status === "fail") autoHint(topic, task, r);
}

document.addEventListener("click", e => {
  const b = e.target.closest("button[data-action]");
  if (!b) return;
  const a = b.dataset.action;
  if (a === "mentor-toggle" || a === "mentor-close") { mentorOpen = a === "mentor-toggle" ? !mentorOpen : false; if (mentorOpen) mentorUnread = false; renderMentor(); return; }
  const topic = COURSE.topics.find(t => t.id === b.dataset.topic);
  const task = topic.tasks.find(t => t.id === b.dataset.task);
  const r = rec(topic.id, task.id), i = +b.dataset.i;
  if (a === "pick") { r.tries++; r.last = task.opts[i]; r.status = grade(task, i) ? "ok" : "fail"; }
  else if (a === "up" || a === "down") { const j = a === "up" ? i - 1 : i + 1; [r.order[i], r.order[j]] = [r.order[j], r.order[i]]; r.status = undefined; }
  else if (a === "check") { r.tries++; r.last = r.order.join(" → "); r.status = grade(task, r.order) ? "ok" : "fail"; }
  else if (a === "check-open") { checkOpen(topic, task, r); return; }
  else if (a === "reveal") { mentorOpen = true; mentorSend(topic, `Покажи разбор задания «${task.q}»: объясни правильный ответ.`); render(); return; }
  else if (a === "skip") r.status = "skip";
  else if (a === "unskip") r.status = undefined;
  save(topic.id); render();
  if (r.status === "fail" && sampleFn) autoHint(topic, task, r);
});
document.addEventListener("input", e => {
  const el = e.target.closest("textarea[data-action=text]");
  if (el) { rec(el.dataset.topic, el.dataset.task).text = el.value; save(el.dataset.topic); }
});
document.getElementById("mentor-form").addEventListener("submit", e => {
  e.preventDefault();
  const inp = document.getElementById("mentor-input"), topic = curTopic();
  if (inp.value.trim() && topic) { mentorSend(topic, inp.value.trim()); inp.value = ""; }
});
addEventListener("hashchange", render);
render();
</script>
</body>
</html>
